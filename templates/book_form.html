{% extends "base.html" %}
{% block content %}
<h2>{{ 'Sửa' if book else 'Thêm' }} sách</h2>
{% if not categories %}
  <div class="alert alert-warning">Chưa có danh mục. Hãy <a href="{{ url_for('add_category') }}">thêm danh mục</a> trước.</div>
{% else %}
<form method="post" class="mt-3" style="max-width:500px">
  <div class="mb-3">
    <label class="form-label">Tên sách</label>
    <input class="form-control" name="title" required value="{{ book.title if book else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Tác giả</label>
    <input class="form-control" name="author" value="{{ book.author if book else '' }}">
  </div>
  <div class="row">
    <div class="col mb-3">
      <label class="form-label">Giá</label>
      <input type="number" min="0" step="1000" class="form-control" name="price" value="{{ book.price if book else 0 }}">
    </div>
    <div class="col mb-3">
      <label class="form-label">Số lượng</label>
      <input type="number" min="0" class="form-control" name="quantity" value="{{ book.quantity if book else 0 }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Danh mục</label>
    <select name="category_id" class="form-select" required>
      {% for c in categories %}
      <option value="{{ c.id }}"
        {{ 'selected' if (book and book.category_id == c.id) or (preselect == c.id) }}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">Lưu</button>
  <a class="btn btn-secondary" href="{{ url_for('books') }}">Hủy</a>
</form>
{% endif %}
{% endblock %}
