{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2>Danh mục sách</h2>
  <a class="btn btn-primary" href="{{ url_for('add_category') }}">+ Thêm danh mục</a>
</div>
<table class="table table-bordered">
  <tr><th>ID</th><th>Tên</th><th>Mô tả</th><th>Số sách</th><th>Thao tác</th></tr>
  {% for c in categories %}
  <tr>
    <td>{{ c.id }}</td>
    <td>{{ c.name }}</td>
    <td>{{ c.description }}</td>
    <td><a href="{{ url_for('books', category_id=c.id) }}">{{ c.book_count }}</a></td>
    <td>
      <a class="btn btn-sm btn-warning" href="{{ url_for('edit_category', id=c.id) }}">Sửa</a>
      <form method="post" action="{{ url_for('delete_category', id=c.id) }}" class="d-inline"
            onsubmit="return confirm('Xóa danh mục này sẽ xóa luôn các sách bên trong. Tiếp tục?')">
        <button class="btn btn-sm btn-danger">Xóa</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5" class="text-center">Chưa có danh mục</td></tr>
  {% endfor %}
</table>
{% endblock %}
