{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h2>Danh sách sách</h2>
  <a class="btn btn-primary"
     href="{{ url_for('add_book', category_id=selected) if selected else url_for('add_book') }}">+ Thêm sách</a>
</div>

<form method="get" class="mb-3 d-flex gap-2" style="max-width:400px">
  <select name="category_id" class="form-select" onchange="this.form.submit()">
    <option value="">-- Tất cả danh mục --</option>
    {% for c in categories %}
    <option value="{{ c.id }}" {{ 'selected' if selected == c.id }}>{{ c.name }}</option>
    {% endfor %}
  </select>
</form>

<table class="table table-bordered">
  <tr><th>ID</th><th>Tên sách</th><th>Tác giả</th><th>Giá</th><th>SL</th><th>Danh mục</th><th>Thao tác</th></tr>
  {% for b in books %}
  <tr>
    <td>{{ b.id }}</td><td>{{ b.title }}</td><td>{{ b.author }}</td>
    <td>{{ b.price | vnd }}</td><td>{{ b.quantity }}</td>
    <td>{{ b.category_name }}</td>
    <td>
      <a class="btn btn-sm btn-warning" href="{{ url_for('edit_book', id=b.id) }}">Sửa</a>
      <form method="post" action="{{ url_for('delete_book', id=b.id) }}" class="d-inline"
            onsubmit="return confirm('Xóa sách này?')">
        <button class="btn btn-sm btn-danger">Xóa</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="7" class="text-center">Chưa có sách</td></tr>
  {% endfor %}
</table>
{% endblock %}
