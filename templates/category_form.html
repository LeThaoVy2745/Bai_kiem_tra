{% extends "base.html" %}
{% block content %}
<h2>{{ 'Sửa' if category else 'Thêm' }} danh mục</h2>
<form method="post" class="mt-3" style="max-width:500px">
  <div class="mb-3">
    <label class="form-label">Tên danh mục</label>
    <input class="form-control" name="name" required value="{{ category.name if category else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Mô tả</label>
    <textarea class="form-control" name="description">{{ category.description if category else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Lưu</button>
  <a class="btn btn-secondary" href="{{ url_for('categories') }}">Hủy</a>
</form>
{% endblock %}
